# sdk-java Gradle properties
#
# This file intentionally contains no credentials or remote publication defaults.
#
# Preflight stages Maven publications only when an explicit local path is supplied:
#   -PpublicationStagingRepository=/absolute/task-local/path
#
# A later authorized Maven Central Publisher Portal release supplies these values
# from CI secrets, never from this file:
#   CENTRAL_PUBLISHER_TOKEN_USERNAME
#   CENTRAL_PUBLISHER_TOKEN_PASSWORD
#   -PsigningKey=<ASCII-armored-private-key>
#   -PsigningPassword=<key-passphrase>
#   -PcentralReleaseApproved=true
#
# The build has no remote upload repository. See CENTRAL_PUBLISHING.md for the
# current bundle/upload contract and the external approval gates.

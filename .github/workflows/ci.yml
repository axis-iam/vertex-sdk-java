name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: SDK tests and plugin validation
        run: >-
          bash ./gradlew --no-daemon
          :vertex-sdk-core:test
          :vertex-gradle-plugin:test
          :vertex-sdk-test:test
          :vertex-gradle-plugin:validatePlugins
          verifyCentralPortalConfiguration
